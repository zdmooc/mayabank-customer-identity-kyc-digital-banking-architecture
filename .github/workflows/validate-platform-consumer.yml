name: validate-platform-consumer

on:
  push:
    paths:
      - "platform-consumption/**"
      - ".github/workflows/validate-platform-consumer.yml"
  pull_request:
    paths:
      - "platform-consumption/**"
      - ".github/workflows/validate-platform-consumer.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-kubectl@v4
        with:
          version: v1.31.0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Parse consumer contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import yaml
          for path in [
              Path("platform-consumption/capability-consumption.yaml"),
              *sorted(Path("platform-consumption/manifests").glob("*.yaml")),
          ]:
              docs=list(yaml.safe_load_all(path.read_text(encoding="utf-8")))
              assert docs and all(doc is not None for doc in docs), path
              print("validated", path)
          PY

      - name: Render Kustomize
        run: |
          set -euo pipefail
          kubectl kustomize platform-consumption/manifests > /tmp/customer-kyc-consumer.yaml
          test -s /tmp/customer-kyc-consumer.yaml

      - name: Shared-platform contract checks
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'mode: CONSUME_SHARED' platform-consumption/capability-consumption.yaml
          grep -q 'keycloak.apps-crc.testing/realms/mayabank' platform-consumption/manifests/platform-config.yaml
          grep -q 'otel-collector.shared-observability.svc:4318' platform-consumption/manifests/platform-config.yaml
          ! grep -RniE 'client-secret:|password:|token:' platform-consumption/manifests
          echo "CUSTOMER_KYC_SHARED_PLATFORM_CONTRACT=PASS"
